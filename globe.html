<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Cyber Threat Globe</title>

<style>
  body {
    margin: 0;
    overflow: hidden;
    background: black;
    font-family: Arial, sans-serif;
  }

  canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: -1;
  }

  .overlay {
    position: absolute;
    top: 20px;
    left: 20px;
    color: #00ffcc;
    font-size: 18px;
  }
</style>
</head>

<body>

<div class="overlay">🌐 Live Threat Map (Demo)</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

<script>
/* ================== SETUP ================== */
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.z = 3;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

/* ================== LIGHTING ================== */
const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);

const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
directionalLight.position.set(5, 3, 5);
scene.add(directionalLight);

/* ================== STARFIELD ================== */
const starsGeometry = new THREE.BufferGeometry();
const starsCount = 5000;

const positions = new Float32Array(starsCount * 3);

for (let i = 0; i < starsCount * 3; i++) {
  positions[i] = (Math.random() - 0.5) * 2000;
}

starsGeometry.setAttribute(
  'position',
  new THREE.BufferAttribute(positions, 3)
);

const starsMaterial = new THREE.PointsMaterial({
  color: 0xffffff,
  size: 0.7
});

const stars = new THREE.Points(starsGeometry, starsMaterial);
scene.add(stars);

/* ================== EARTH ================== */
const textureLoader = new THREE.TextureLoader();

const earthTexture = textureLoader.load(
  "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg"
);

const globe = new THREE.Mesh(
  new THREE.SphereGeometry(1, 64, 64),
  new THREE.MeshStandardMaterial({
    map: earthTexture,
    roughness: 1,
    metalness: 0
  })
);

scene.add(globe);

/* ================== ATMOSPHERE GLOW ================== */
const glow = new THREE.Mesh(
  new THREE.SphereGeometry(1.05, 64, 64),
  new THREE.MeshBasicMaterial({
    color: 0x00ffff,
    transparent: true,
    opacity: 0.15
  })
);

scene.add(glow);

/* ================== LAT/LONG TO 3D ================== */
function latLongToVector3(lat, lon, radius) {
  const phi = (90 - lat) * (Math.PI / 180);
  const theta = (lon + 180) * (Math.PI / 180);

  return new THREE.Vector3(
    -radius * Math.sin(phi) * Math.cos(theta),
    radius * Math.cos(phi),
    radius * Math.sin(phi) * Math.sin(theta)
  );
}

/* ================== ATTACK ARC ================== */
function createAttack(lat1, lon1, lat2, lon2) {
  const start = latLongToVector3(lat1, lon1, 1);
  const end = latLongToVector3(lat2, lon2, 1);

  const mid = start.clone().add(end).multiplyScalar(0.5);
  mid.normalize().multiplyScalar(1.5);

  const curve = new THREE.QuadraticBezierCurve3(start, mid, end);
  const points = curve.getPoints(50);

  const geometry = new THREE.BufferGeometry().setFromPoints(points);

  const material = new THREE.LineBasicMaterial({
    color: 0x00ffcc
  });

  const line = new THREE.Line(geometry, material);
  scene.add(line);

  setTimeout(() => scene.remove(line), 2000);
}

/* ================== RANDOM ATTACKS ================== */
function randomAttack() {
  const lat1 = Math.random() * 180 - 90;
  const lon1 = Math.random() * 360 - 180;
  const lat2 = Math.random() * 180 - 90;
  const lon2 = Math.random() * 360 - 180;

  createAttack(lat1, lon1, lat2, lon2);
}

setInterval(randomAttack, 500);

/* ================== ANIMATION ================== */
function animate() {
  requestAnimationFrame(animate);

  globe.rotation.y += 0.0015;
  glow.rotation.y += 0.0015;
  stars.rotation.y += 0.0003;

  renderer.render(scene, camera);
}
animate();

/* ================== RESPONSIVE ================== */
window.addEventListener("resize", () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});
</script>

</body>
</html>
